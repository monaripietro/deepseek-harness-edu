# Build Harness Lab and publish it to the existing custom Pages domain.
name: Deploy Harness Lab

on:
  push:
    branches: [master]
    paths:
      - 'apps/edu-harness-lab/**'
      - '.github/workflows/edu-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/edu-harness-lab/pnpm-lock.yaml
      - uses: actions/configure-pages@v5
      - name: Install Harness Lab dependencies
        working-directory: apps/edu-harness-lab
        run: pnpm install --frozen-lockfile
      - name: Build Harness Lab
        working-directory: apps/edu-harness-lab
        env:
          HARNESS_LAB_BASE: /
        run: pnpm build
      - name: Add custom-domain file
        run: |
          echo 'harness.monaripietro.it' > apps/edu-harness-lab/dist/CNAME
      - name: Verify artifact contents
        run: |
          test -f apps/edu-harness-lab/dist/index.html
          test -f apps/edu-harness-lab/dist/manifest.webmanifest
          test -n "$(find apps/edu-harness-lab/dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -n "$(find apps/edu-harness-lab/dist/assets -maxdepth 1 -type f -name '*.css' -print -quit)"
          test "$(cat apps/edu-harness-lab/dist/CNAME)" = 'harness.monaripietro.it'
          echo "Artifact verified:"
          find apps/edu-harness-lab/dist -type f | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/edu-harness-lab/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
