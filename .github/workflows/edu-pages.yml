# Deploy the EDU Observable Harness static mini-app to GitHub Pages.
# The app is fully static (no build step), so the workflow only copies the
# app folder to the Pages artifact and deploys it.
name: Deploy EDU Observable Harness

on:
  push:
    branches: [master]
    paths:
      - 'apps/edu-observable-harness/**'
      - '.github/workflows/edu-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -r apps/edu-observable-harness/* _site/
          echo 'harness.monaripietro.it' > _site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
